name: Deploy reviewed environment
on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KIZUNA_DEPLOY_TARGET: ${{ inputs.target }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate remote resource IDs
        run: |
          node --input-type=module -e "import fs from 'node:fs';if(fs.readFileSync('wrangler.toml','utf8').includes('00000000-0000-0000-0000-00000000000'))throw Error('Replace remote D1 placeholder IDs before deployment');"
      - name: Migrate and deploy
        run: |
          export XDG_CONFIG_HOME="$PWD/.wrangler/config"
          export WRANGLER_LOG_PATH=/tmp/kizuna-wrangler-logs
          if [ "$KIZUNA_DEPLOY_TARGET" = "production" ]; then
            npx wrangler d1 migrations apply kizuna-production --remote --env production
            npm run deploy:production
          else
            npx wrangler d1 migrations apply kizuna-preview --remote
            npm run deploy:preview
          fi
