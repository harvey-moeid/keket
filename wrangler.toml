name = "kizuna-production"
main = "src/server/index.ts"
compatibility_date = "2026-10-10"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_ENV = "production"
ADMIN_USERNAME = "admin"
ADMIN_REQUIRE_PASSWORD_CHANGE = "true"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthStore"

[[migrations]]
tag = "v2-auth-kv"
new_sqlite_classes = ["AuthStore"]

# Wrangler provisions this namespace on the first deploy and reuses the binding.
[[kv_namespaces]]
binding = "DATA"

[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "kizuna-production-assets"
